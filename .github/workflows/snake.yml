name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # araw-araw mag-update
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: janineluces49-star
          outputs: dist/github-contribution-grid-snake.svg

      - name: Upload Snake
        uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist/github-contribution-grid-snake.svg
