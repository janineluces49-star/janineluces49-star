name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # araw-araw mag-update
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: Platane/snk@master
        with:
          github_user_name: janineluces49-star
          outputs: dist/snake.svg
      - name: Push Snake
        uses: EndBug/add-and-commit@v7
        with:
          add: "dist/snake.svg"
          message: "Generate snake graph"
